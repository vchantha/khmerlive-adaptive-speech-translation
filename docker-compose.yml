name: khmerlive

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-khmerlive}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-khmerlive}

  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19093}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SSL}
  KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-/etc/khmerlive/tls/ca.crt}
  KAFKA_INGEST_TOPIC: ${KAFKA_INGEST_TOPIC:-khmerlive.ingest.requests}
  KAFKA_CHUNK_TOPIC: ${KAFKA_CHUNK_TOPIC:-khmerlive.media.chunks}
  KAFKA_JOB_TOPIC: ${KAFKA_JOB_TOPIC:-khmerlive.job.events}
  KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-khmerlive-ingestion-worker}

  SILO_ENDPOINT: ${SILO_ENDPOINT:-silo:9000}
  SILO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  SILO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-silo-long-password}
  SILO_BUCKET: ${MINIO_BUCKET:-khmerlive}
  SILO_SECURE: "${SILO_SECURE:-true}"
  SILO_CA_FILE: ${SILO_CA_FILE:-/etc/khmerlive/tls/ca.crt}

  # Backward-compatible variables for libraries/notebooks expecting MinIO names.
  MINIO_ENDPOINT: ${SILO_ENDPOINT:-silo:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-silo-long-password}
  MINIO_BUCKET: ${MINIO_BUCKET:-khmerlive}

  MAX_STREAM_SECONDS: ${MAX_STREAM_SECONDS:-3600}
  AUDIO_CHUNK_SECONDS: ${AUDIO_CHUNK_SECONDS:-30}
  STREAM_SEGMENT_SECONDS: ${STREAM_SEGMENT_SECONDS:-10}
  CORS_ORIGINS: https://localhost:${HTTPS_PORT:-8443},https://127.0.0.1:${HTTPS_PORT:-8443}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khmerlive}
      POSTGRES_USER: ${POSTGRES_USER:-khmerlive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khmerlive} -d ${POSTGRES_DB:-khmerlive}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SSL_INTERNAL:SSL,SSL_HOST:SSL
      KAFKA_LISTENERS: CONTROLLER://:29093,SSL_HOST://:9093,SSL_INTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: SSL_HOST://localhost:9093,SSL_INTERNAL://kafka:19093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL_INTERNAL
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_TLS_PASSWORD:-change-me-kafka-tls}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_TLS_PASSWORD:-change-me-kafka-tls}
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_PASSWORD:-change-me-kafka-tls}
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.2,TLSv1.3
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
      - ./infra/tls/generated/kafka:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --command-config /etc/kafka/secrets/client.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/tls/generated/kafka:/etc/kafka/secrets:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in           "${KAFKA_INGEST_TOPIC:-khmerlive.ingest.requests}"           "${KAFKA_CHUNK_TOPIC:-khmerlive.media.chunks}"           "${KAFKA_JOB_TOPIC:-khmerlive.job.events}"; do
          /opt/kafka/bin/kafka-topics.sh             --bootstrap-server kafka:19093             --command-config /etc/kafka/secrets/client.properties             --create --if-not-exists             --topic "$$topic" --partitions 3 --replication-factor 1
        done

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: server /data --certs-dir /certs --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-silo-long-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo-data:/data
      - ./infra/tls/generated/silo:/certs:ro
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-keyfile
      - /etc/khmerlive/tls/api/tls.key
      - --ssl-certfile
      - /etc/khmerlive/tls/api/tls.crt
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      silo:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8443"
    volumes:
      - ./infra/tls/generated:/etc/khmerlive/tls:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/etc/khmerlive/tls/ca.crt", "https://localhost:8443/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      silo:
        condition: service_started
    volumes:
      - ./infra/tls/generated:/etc/khmerlive/tls:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/tls/generated/web:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  jupyterhub:
    build:
      context: ./training
    environment:
      <<: *app-env
      JUPYTERHUB_PASSWORD: ${JUPYTERHUB_PASSWORD:-change-me-jupyter}
      JUPYTERHUB_ADMIN_PASSWORD: ${JUPYTERHUB_ADMIN_PASSWORD:-change-me-admin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379/0
      AWS_CA_BUNDLE: /etc/khmerlive/tls/ca.crt
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      silo:
        condition: service_started
    ports:
      - "8001:8000"
    volumes:
      - jupyterhub-data:/srv/jupyterhub
      - ./training/notebooks:/workspace/notebooks
      - ./training/workspace:/workspace/workspace
      - ./infra/tls/generated:/etc/khmerlive/tls:ro
      - ./infra/tls/generated/jupyterhub:/etc/jupyterhub/tls:ro
    restart: unless-stopped

  mlflow:
    build:
      context: ./training
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - s3://${MINIO_BUCKET:-khmerlive}/mlflow
      - --allowed-hosts
      - localhost:*,mlflow:5000,127.0.0.1:*
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-silo-long-password}
      AWS_CA_BUNDLE: /etc/khmerlive/tls/ca.crt
      MLFLOW_S3_ENDPOINT_URL: https://silo:9000
    depends_on:
      silo:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
      - ./infra/tls/generated/ca.crt:/etc/khmerlive/tls/ca.crt:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  silo-data:
  jupyterhub-data:
  mlflow-data:
